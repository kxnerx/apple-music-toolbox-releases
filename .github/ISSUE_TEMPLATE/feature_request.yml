name: Idea or feature request
description: Something you'd like Music Toolbox to do
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe it the way you'd use it, e.g. "I want to ask for a playlist that changes every week".
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
      description: What are you trying to do today, and what gets in the way?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, screenshots, or apps that do this well.
